<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deadlock kill feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font: 13px/1.3 "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif; color: #e9edf2; }

  .feed {
    position: fixed; top: 28px; right: 24px; width: 380px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .row {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    background: rgba(13, 16, 21, .92); border-right: 3px solid #555; border-radius: 3px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .5); white-space: nowrap;
    animation: in .28s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  @keyframes in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  .row.fade { opacity: 0; transition: opacity .6s ease; }
  .row.amber { border-color: #f0a13c; }
  .row.sapphire { border-color: #58aaf0; }

  .who { font-weight: 600; }
  .who.victim { font-weight: 400; color: #aeb7c4; }
  .arrow { color: #6d7783; font-size: 11px; }
  .gold { margin-left: 6px; font-size: 11px; color: #e8b33e; font-variant-numeric: tabular-nums; }
  .fb {
    margin-right: 6px; padding: 1px 5px; font-size: 9px; letter-spacing: .16em;
    color: #ffb9b4; background: rgba(224, 82, 74, .18); border: 1px solid rgba(224, 82, 74, .5);
    border-radius: 2px;
  }
  .multi {
    margin-left: 6px; padding: 1px 5px; font-size: 9px; letter-spacing: .14em;
    color: #ffd9a8; background: rgba(240, 161, 60, .18); border: 1px solid rgba(240, 161, 60, .5);
    border-radius: 2px;
  }
  .skull { color: #cf6b62; font-size: 11px; }
  .row.death { border-color: #4a5360; }
  .row.death .who { font-weight: 500; color: #dfe5ec; }
  .lbl {
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #8b95a3;
  }
  .row.spree { border-color: #d8b04a; }
  .row.spree .who { color: #ffd98a; }
  .cnt { font-weight: 700; font-variant-numeric: tabular-nums; color: #d8b04a; }
  .offline .feed { opacity: .3; }
</style>
</head>
<body>
<div class="feed" id="feed"></div>

<script src="dlock.js"></script>
<script>
const { esc, teamClass } = DL;
const feed = document.getElementById('feed');
const rows = new Map();
const LIFE = 14000;

function apply(st) {
  const seen = new Set();
  for (const k of st.kills.slice(0, 6)) {
    if (k.ageMs > LIFE) continue;
    seen.add(k.id);
    let row = rows.get(k.id);
    if (!row) {
      row = document.createElement('div');
      if (k.kind === 'spree') {
        row.className = 'row spree ' + teamClass(k.attackerTeam);
        row.innerHTML = '<span class="who hit"></span>' +
          '<span class="lbl">most kills</span><span class="cnt"></span>';
        row.querySelector('.hit').textContent = k.attacker || '?';
        row.querySelector('.cnt').textContent = '\u00D7' + (k.count || 1);
      } else if (k.kind === 'death') {
        row.className = 'row death';
        row.innerHTML = '<span class="skull">\u2716</span>' +
          '<span class="who victim"></span><span class="lbl">died</span>';
        row.querySelector('.victim').textContent = k.victim || '?';
      } else {
        row.className = 'row ' + teamClass(k.attackerTeam);
        row.innerHTML =
          '<span class="fb" hidden>FIRST BLOOD</span>' +
          '<span class="who hit"></span><span class="arrow">\u25B8</span>' +
          '<span class="who victim"></span><span class="multi" hidden></span>' +
          '<span class="gold"></span>';
        row.querySelector('.hit').textContent = k.attacker || '?';
        row.querySelector('.victim').textContent = k.victim || '?';
        row.querySelector('.gold').textContent = k.gold ? '+' + k.gold : '';
        row.querySelector('.fb').hidden = !k.firstBlood;
        if (k.multi > 1) {
          row.querySelector('.multi').textContent = '\u00D7' + k.multi;
          row.querySelector('.multi').hidden = false;
        }
      }
      feed.appendChild(row);
      rows.set(k.id, row);
    }
    row.classList.toggle('fade', k.ageMs > LIFE - 700);
  }

  for (const [id, row] of rows) {
    if (!seen.has(id)) { row.remove(); rows.delete(id); }
  }
}

DL.start(apply);
</script>
</body>
</html>
